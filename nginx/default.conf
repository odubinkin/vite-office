server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(woff2?|ttf|otf|ttc|eot)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ "^/assets/.+-[A-Za-z0-9_-]{8}[.]m?js$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
